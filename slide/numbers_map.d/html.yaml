- text: cfgMaxRows:'{}'
  allow: hằng số vre.config Settings.cypher_max_rows, không phải số đo
- text: cfgRetries:'{}'
  allow: tham số text2cypher(retries=2) trong src/vre/graph/text2cypher.py
- text: cfgRrfK:'{}'
  allow: hằng số k của công thức RRF
- text: ${{*}}
  allow: biểu thức JS trong template literal (toạ độ, phép tính giao diện, tham chiếu V.*); số dữ liệu nằm trong V
- text: ="{*}"
  allow: giá trị thuộc tính HTML/SVG trong chuỗi JS (toạ độ, kích thước, màu), không phải số liệu
- text: Quận {}
  allow: tên quận
- text: <span class="tick">○</span>{}.
  allow: số thứ tự mục trong mục lục
- text: <span class="num">{}</span>
  allow: số thứ tự mục
- text: P4-{}
  allow: mã cell notebook 04
- text: mục {}
  allow: tham chiếu số mục trong trang
- text: /*Q-BEGIN*/{*}/*Q-END*/
  allow: đề bài nguyên văn benchmark/questions.jsonl (tập con eval_summary.benchmark_subset)
- text: /*S-BEGIN*/{*}/*S-END*/
  allow: 'Cypher mẫu cho trò chơi năm trạm: câu thật error_analysis.json examples[0].cypher và câu minh hoạ an toàn'
- text: /*A2-BEGIN*/{*}/*A2-END*/
