- slide: kg-cypher-multihop
  in: body
  shape: 7
  text: Dự án Sunshine Sky City nằm ở quận nào, và giá/m² căn hộ của quận đó cao hay thấp hơn trung vị căn hộ toàn TP.HCM bao nhiêu %?
  allow: nguyên văn examples.json:graph[2].question
- slide: kg-cypher-multihop
  in: body
  shape: 9
  text: 'MATCH (p:Project)-[:IN_DISTRICT]->(d:District)-[:IN_PROVINCE]->(:Province {name: ''Hồ Chí Minh''}) WHERE toLower(p.name) CONTAINS ''sunshine sky city'' MATCH (md:MarketStat {scope: ''district'',
    property_type: ''Căn hộ chung cư'', month: ''ALL'', deal_type: ''sale''})-[:STAT_OF]->(d) MATCH (mv:MarketStat {scope: ''province'', property_type: ''Căn hộ chung cư'', month: ''ALL'', deal_type: ''sale''})-[:STAT_OF]->(:Province
    {name: ''Hồ Chí Minh''}) RETURN d.name AS district, round(md.median_price_m2_mil, 2) AS district_median_m2_mil, round(mv.median_price_m2_mil, 2) AS hcm_median_m2_mil, round((md.median_price_m2_mil /
    mv.median_price_m2_mil - 1) * 100, 2) AS percentage_diff

    LIMIT 50'
  allow: nguyên văn examples.json:graph[2].cypher
