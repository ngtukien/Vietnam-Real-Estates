  text: 'Hai khái niệm. Centrality đo mức quan trọng của một node theo vị trí, dạng đơn giản nhất là bậc chia cho số node còn lại; ở đây chỉ để hiểu, pipeline không dùng nó. Modularity đo các cụm dày cạnh
    hơn ngẫu nhiên bao nhiêu. Không chạy Leiden trên cây tỉnh, quận, phường, vì cây không có cạnh chéo nên không có cụm. Code dựng đồ thị tương đồng: mỗi phường đủ số tin là một hồ sơ gồm log giá trên mét
    vuông trung vị, log số tin và tỷ lệ từng loại hình, chuẩn hoá rồi nối với {} phường gần nhất. Leiden với seed {} chia {} phường thành {} cụm, modularity {}, tức cấu trúc cụm rõ. Mỗi phường được nối
