- slide: rag-two-phases
  in: notes
  shape: 0
  full: true
  text: 'Pha lập chỉ mục chạy ngoại tuyến. Nhóm đọc {} dòng thô, làm sạch và bỏ trùng còn {} tin, cắt thành {} chunk, nhúng bằng multilingual-e5-large ra vector {} chiều, rồi lưu vào Qdrant cùng vector
    thưa BM25. Pha này chỉ chạy lại khi dữ liệu đổi. Pha truy vấn chạy cho mỗi câu hỏi: tìm bằng cả vector dày và BM25 rồi gộp hai danh sách bằng RRF, ghép ngữ cảnh vào prompt, LLM trả lời kèm mã tin. Mọi
    phần sau của bài là cải tiến một hộp trong hai hàng này. Chuyển sang slide sau: trước khi xây, nhìn kỹ dữ liệu.'
