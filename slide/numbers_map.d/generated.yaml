  text: 'Về đánh giá, lượt chạy dùng đủ {} câu benchmark với cả bốn hệ, nhưng câu trả lời chấm bằng luật so với đáp án SQL. Nhóm chủ động không dùng LLM làm giám khảo và không chạy RAGAS để tiết kiệm chi
    phí, nên chưa đo faithfulness. Mô hình sinh là gemini-flash-lite-latest, khác gpt-oss-120b dự kiến ban đầu. Về dữ liệu, giá là giá rao, không phải giá giao dịch; địa giới có cả tên cũ và tên sau sáp
    nhập năm 2025; tin không có toạ độ; nhiều cột thiếu, ví dụ đường thiếu {}% và dự án thiếu {}%. Giấy phép dữ liệu chỉ cho phép dùng phi thương mại. Image Docker của API và web đã dựng và kiểm qua nginx:
    trang chủ, health, chat stream và định giá đều trả về thành công. Cột bên phải là việc làm tiếp. Slide sau: những điều cần nhớ.'
