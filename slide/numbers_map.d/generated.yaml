  shape: 13
  text: 'Dựa trên các tài liệu được cung cấp, diện tích của các lô đất ở Củ Chi lần lượt là: 220 m² [Tin#2045133780349874], 84,2 m² [Tin#6996937738248262], 3.000 m² [Tin#759967255344203], 180 m² [Tin#1167455787622469],
    và 3.043 m² [Tin#8273646489036237]. Sắp xếp theo thứ tự tăng dần: 84,2 m², 180 m², 220 m², 3.000 m², 3.043 m². Giá trị trung vị (ở giữa) là 220 m² [Tin#2045133780349874].'
