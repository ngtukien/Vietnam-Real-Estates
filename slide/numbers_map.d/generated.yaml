  text: Bộ benchmark có {} câu chia chín nhóm, từ tra cứu một tin tới tổng hợp trên toàn bộ dữ liệu. Ba câu trên slide là ba mức khó. Câu tra cứu chỉ cần tìm đúng một tin, mã đầy đủ là {}. Câu ràng buộc
    có nhiều điều kiện cứng cùng lúc, có {} tin thoả, nên embedding không đủ mà phải lọc. Câu tổng hợp phải gom {} tin căn hộ của một quận để tính trung vị, không tin đơn lẻ nào chứa đáp án. Đáp án chuẩn
    của mọi câu tính bằng SQL trên bảng sạch, không nhờ LLM. Không có một công cụ nào hợp cho cả ba; phần còn lại của bài đi lần lượt từng mức.
