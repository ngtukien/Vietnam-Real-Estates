# CI Phase 3: lint, unit (+coverage), notebook, web (+Playwright với API giả). Chạy không có `.env` (bug B10).
# Không dùng `paths:` — các job này là check bắt buộc (ci-cd-trigger-design #3). Cài thư viện từ requirements/dev.txt (bug B9).
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VRE_LOAD_DOTENV: "0"
  PYTHONUTF8: "1"

jobs:
  lint:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Cài thư viện
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Ruff
        run: python -m ruff check src tests scripts api
      - name: Mypy
        run: python -m mypy src/vre api

  unit:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Cài thư viện
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Unit test + coverage
        run: >-
          python -m pytest -q -m "not integration and not gpu and not notebooks"
          --cov=vre --cov=api --cov-report=term-missing --cov-fail-under=70

  notebooks:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Cài thư viện
        run: pip install -r requirements/dev.txt
      - name: Chạy 5 notebook trên results/ đã commit
        run: python -m pytest -q -m notebooks tests/test_notebooks.py

  web:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VRE_FAKE_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài thư viện Python
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: npm ci
        run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Vitest
        run: npm run test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Cài Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Khởi động API giả
        run: |
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "API không sẵn sàng sau 60 giây"
          cat api.log
          exit 1
      - name: Playwright e2e
        run: npm run e2e
        working-directory: web
      - name: Log API khi lỗi
        if: failure()
        run: cat api.log || true
