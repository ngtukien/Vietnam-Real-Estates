# CI Phase 3: lint, unit (+coverage), notebook, web (+Playwright với API giả). Chạy không có `.env` (bug B10).
# Không dùng `paths:` — các job này là check bắt buộc (ci-cd-trigger-design #3). Cài thư viện từ requirements/dev.txt (bug B9).
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VRE_LOAD_DOTENV: "0"
  PYTHONUTF8: "1"

jobs:
  lint:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Cài thư viện
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Ruff
        run: python -m ruff check src tests scripts api
      - name: Mypy
        run: python -m mypy src/vre api

  unit:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Cài thư viện
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Unit test + coverage
        run: >-
          python -m pytest -q -m "not integration and not gpu and not notebooks"
          --cov=vre --cov=api --cov-report=term-missing --cov-fail-under=70

  notebooks:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Cài thư viện
        run: pip install -r requirements/dev.txt
      - name: Chạy 5 notebook trên results/ đã commit
        run: python -m pytest -q -m notebooks tests/test_notebooks.py

  web:
    if: github.event.head_commit.author.name != 't1k-ci-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # playwright.config.ts tự khởi động API giả (uvicorn, VRE_FAKE_BACKENDS=1, rate limit nới) từ VRE_API_DIR bằng VRE_PY
    # và Vite dev server; không khởi động tay để env của API chỉ có một nguồn (config).
    env:
      VRE_FAKE_BACKENDS: "1"
      VRE_PY: python
      VRE_API_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài thư viện Python
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: npm ci
        run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Vitest
        run: npm run test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Cài Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Playwright e2e
        run: npm run e2e
        working-directory: web
      - name: Báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
