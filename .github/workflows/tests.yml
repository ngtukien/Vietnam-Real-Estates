# Unit test của package vre (không mạng, không GPU, không Docker). Phase 3 bổ sung CI đầy đủ.
name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VRE_LOAD_DOTENV: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Cài thư viện
        run: pip install -r requirements/dev.txt xgboost
      - name: Chạy unit test
        run: python -m pytest -q -m "not integration and not gpu"
      - name: Ruff
        run: python -m ruff check src tests scripts
