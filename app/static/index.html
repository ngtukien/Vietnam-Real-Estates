<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot BĐS</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⌂</span>
      <div>
        <h1>Chatbot bất động sản</h1>
        <p id="stats" class="muted">Đang kết nối…</p>
      </div>
    </div>
    <label class="model-picker">
      <span>Chế độ</span>
      <select id="system"></select>
    </label>
  </header>

  <main id="messages" class="messages" aria-live="polite">
    <section class="welcome" id="welcome">
      <h2>Bạn muốn hỏi gì về thị trường?</h2>
      <p class="muted">Hỏi bằng tiếng Việt. Điều kiện giá, quận, số phòng trong câu hỏi được tự nhận diện.
        Chế độ Tự động chọn giữa tìm theo mô tả (RAG), truy vấn đồ thị (Cypher) hoặc kết hợp cả hai.</p>
      <div class="examples">
        <button type="button">Căn hộ 2PN ở Thủ Đức dưới 3 tỷ</button>
        <button type="button">Nhà ở Cầu Giấy dưới 10 tỷ có thang máy</button>
        <button type="button">Quận nào ở Hà Nội có giá/m² trung bình cao nhất?</button>
        <button type="button">Năm quận nào của Hồ Chí Minh có nhiều tin đăng nhất?</button>
      </div>
    </section>
  </main>

  <footer class="composer">
    <form id="chat-form" class="input-row">
      <input id="query" type="text" autocomplete="off" placeholder="Ví dụ: Căn hộ 2PN ở Thủ Đức dưới 3 tỷ" required>
      <button type="submit" id="send">Gửi</button>
    </form>
  </footer>

  <template id="source-card">
    <article class="card">
      <div class="card-head">
        <span class="badge type"></span>
        <span class="cite muted"></span>
      </div>
      <h3 class="title"></h3>
      <div class="facts">
        <div><span class="label">Giá</span><strong class="price"></strong></div>
        <div><span class="label">Diện tích</span><strong class="area"></strong></div>
        <div class="rooms-cell"><span class="label">Phòng</span><strong class="rooms"></strong></div>
      </div>
      <p class="address"></p>
      <details class="evidence">
        <summary>Mô tả</summary>
        <p class="description"></p>
      </details>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
