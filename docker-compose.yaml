# Một bộ dịch vụ cho cả hai worktree (coordination §7): luôn chạy bằng
#   docker compose -f D:\Vietnam-Real-Estates\docker-compose.yaml up -d --wait qdrant neo4j
# Dữ liệu nằm ở bind mount tuyệt đối trên ổ D (docker-data/, gitignored), không dùng named volume
# và không cần đổi thiết lập Docker. Volume cũ neo4j_data/neo4j_full_data/qdrant_data (mẫu 20k) không bị đụng tới.
name: vre

services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/docker-data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local_dev_password}
      # Không đặt tên NEO4J_*: entrypoint coi mọi NEO4J_* là thiết lập cấu hình.
      GRAPH_PASSWORD: ${NEO4J_PASSWORD:-local_dev_password}
      # Chia máy với lượt chạy dài của p2 (coordination §8).
      NEO4J_server_memory_heap_initial__size: 4G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 4G
      NEO4J_dbms_memory_transaction_total_max: 2G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/docker-data/neo4j/data:/data
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/docker-data/neo4j/logs:/logs
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/data/graph_import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${GRAPH_PASSWORD}\" \"RETURN 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
