# Một bộ dịch vụ cho cả hai worktree (coordination §7): luôn chạy bằng
#   docker compose -f D:\Vietnam-Real-Estates\docker-compose.yaml up -d --wait qdrant neo4j
# Dữ liệu Neo4j/Qdrant nằm trong named volume (ext4 trong ổ đĩa WSL của Docker Desktop, đặt ở D:\DockerDesktopWSL).
# Không dùng bind mount NTFS cho store: Neo4j/Qdrant dùng mmap, trên drvfs/9p bị chậm và mất nhất quán
# (import 2026-10-15: 87 phút, thiếu 118 node Listing). Log Neo4j vẫn bind mount ra docker-data/ để đọc.
name: vre

services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    # Giới hạn bộ nhớ: mmap file vector làm VM WSL phình tới 17 GB và cạn commit của Windows (2026-10-15).
    mem_limit: 12g
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local_dev_password}
      # Không đặt tên NEO4J_*: entrypoint coi mọi NEO4J_* là thiết lập cấu hình.
      GRAPH_PASSWORD: ${NEO4J_PASSWORD:-local_dev_password}
      # Phase 3: Cypher chỉ đọc MarketStat/đường đi ngắn ⇒ 2G heap + 1G pagecache là đủ; commit Windows
      # cạn khi để 4G/4G cạnh Qdrant + 5 lane song song (2026-10-15, free commit 2,2 GB).
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_memory_transaction_total_max: 1G
    mem_limit: 4g
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/docker-data/neo4j/logs:/logs
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/data/graph_import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${GRAPH_PASSWORD}\" \"RETURN 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # ---- Phase 3 webapp: docker compose --profile app up -d --build api web  (http://127.0.0.1:8080)
  # Dữ liệu mount read-only từ checkout chính; image chỉ chứa code (Dockerfile.api).
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.api
    image: vre-api:latest
    restart: unless-stopped
    mem_limit: 6g
    env_file:
      - path: .env
        required: false
    environment:
      VRE_QDRANT_URL: http://qdrant:6333
      VRE_NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local_dev_password}
      VRE_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      # Client trong mạng Docker không phải loopback; cổng chỉ publish trên 127.0.0.1 nên vẫn chỉ máy chủ gọi được.
      # Mở ra ngoài máy ⇒ đặt VRE_API_TOKEN trong .env.
      VRE_API_ALLOW_REMOTE_WITHOUT_TOKEN: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/.cache/huggingface:/hf:ro
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/results:/app/results:ro
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/models:/app/models:ro
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/data/clean:/app/data/clean:ro
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/data/geo:/app/data/geo:ro
      - ${VRE_DATA_ROOT:-D:/Vietnam-Real-Estates}/index:/app/index:ro
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.web  # Lane C
    image: vre-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
    name: vre_neo4j_data
  qdrant_data:
    name: vre_qdrant_data
